services:
  - type: web
    name: velo-realty-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python seed_db.py && python seed_bulk_projects.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: velo-reality-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0

databases:
  - name: velo-reality-db
    plan: free
